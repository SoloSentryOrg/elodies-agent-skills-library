name: Repository Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Repository Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository and skills
        run: ruby scripts/validate_repository.rb

      - name: Install pinned portable-skill dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r ms-ai-ide-extension-security-assessment/scripts/requirements.lock

      - name: Validate portable skill package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 ms-ai-ide-extension-security-assessment/scripts/validate_skill_package.py
          --expected-version 1.4.5

      - name: Run portable skill regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m unittest discover
          -s ms-ai-ide-extension-security-assessment/scripts
          -p 'test_*.py'

      - name: Validate immutable PowerPoint runtime acceptance
        run: >-
          python3 ms-ai-ide-extension-security-assessment/scripts/validate_pptx_runtime_acceptance.py

      - name: Run lessons-evidence regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate lessons-learned evidence
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/check-lessons-evidence.py

  windows-portability:
    name: Windows Portability Gate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install hash-locked portable dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r ms-ai-ide-extension-security-assessment/scripts/requirements.lock

      - name: Validate complete portable package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python ms-ai-ide-extension-security-assessment/scripts/validate_skill_package.py
          --expected-version 1.4.5

      - name: Run portable regression tests on Windows
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover
          -s ms-ai-ide-extension-security-assessment/scripts
          -p 'test_*.py'

      - name: Parse Windows Office adapters
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw ms-ai-ide-extension-security-assessment/scripts/render_reports_with_word.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw ms-ai-ide-extension-security-assessment/scripts/render_presentations_with_powerpoint.ps1)) | Out-Null
