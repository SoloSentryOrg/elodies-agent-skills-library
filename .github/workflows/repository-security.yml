name: Repository Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Repository Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate repository and skills
        run: ruby scripts/validate_repository.rb

      - name: Install pinned portable-skill dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r ms-ai-ide-extension-security-assessment/scripts/requirements.lock

      - name: Install hash-locked native parser for acceptance tests
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes --no-deps
          -r ms-ai-ide-extension-security-assessment/scripts/native-pdfium-tests.lock

      - name: Verify isolated native parser test installation
        run: >-
          python3 -I -c "import hashlib,importlib.machinery,importlib.metadata,json,pathlib,stat,sys;
          assert sys.flags.isolated and sys.flags.no_user_site;
          assert importlib.metadata.version('pypdfium2') == '5.14.0';
          specs=[importlib.machinery.PathFinder.find_spec(n,sys.path) for n in ('pypdfium2','pypdfium2_raw')];
          assert all(x and x.origin and x.submodule_search_locations for x in specs);
          root=pathlib.Path(specs[1].origin).parent;
          version_bytes=(root/'version.json').open('rb').read(65537);
          assert len(version_bytes) <= 65536;
          version=json.loads(version_bytes);
          assert [version[k] for k in ('major','minor','build','patch')] == [156,0,8076,0];
          binary=root/'libpdfium.so';
          assert stat.S_ISREG(binary.lstat().st_mode);
          data=binary.open('rb').read(33554433);
          assert 0 < len(data) <= 33554432;
          assert hashlib.sha256(data).hexdigest() == 'fd4de9f91f183476d04b1bc3fd17dacd95aba349c55d2c376512d95e082b441e';
          assert not any(n == 'pypdfium2' or n.startswith(('pypdfium2.','pypdfium2_raw')) for n in sys.modules);
          print('Isolated hash-locked Linux parser discovery passed; no native parser imported')"

      - name: Validate portable skill package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 ms-ai-ide-extension-security-assessment/scripts/validate_skill_package.py
          --expected-version 1.4.7

      - name: Run portable skill regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m unittest discover -v
          -s ms-ai-ide-extension-security-assessment/scripts
          -p 'test_*.py'

      - name: Install hash-locked M365 handoff dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r prepare-m365-copilot-handoff/scripts/requirements.lock

      - name: Run M365 handoff regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m unittest discover
          -s prepare-m365-copilot-handoff/tests
          -p 'test_*.py'

      - name: Validate immutable PowerPoint runtime acceptance
        run: >-
          python3 ms-ai-ide-extension-security-assessment/scripts/validate_pptx_runtime_acceptance.py

      - name: Run lessons-evidence regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate lessons-learned evidence
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/check-lessons-evidence.py

  windows-portability:
    name: Windows Portability Gate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-locked portable dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r ms-ai-ide-extension-security-assessment/scripts/requirements.lock

      - name: Install hash-locked native parser for acceptance tests
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes --no-deps
          -r ms-ai-ide-extension-security-assessment/scripts/native-pdfium-tests.lock

      - name: Validate complete portable package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python ms-ai-ide-extension-security-assessment/scripts/validate_skill_package.py
          --expected-version 1.4.7

      - name: Run portable regression tests on Windows
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover -v
          -s ms-ai-ide-extension-security-assessment/scripts
          -p 'test_*.py'

      - name: Install hash-locked M365 handoff dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r prepare-m365-copilot-handoff/scripts/requirements.lock

      - name: Run M365 handoff regression tests on Windows
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover
          -s prepare-m365-copilot-handoff/tests
          -p 'test_*.py'

      - name: Parse Windows Office adapters
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw ms-ai-ide-extension-security-assessment/scripts/render_reports_with_word.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw ms-ai-ide-extension-security-assessment/scripts/render_presentations_with_powerpoint.ps1)) | Out-Null
